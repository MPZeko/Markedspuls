name: Market briefs

on:
  workflow_dispatch:
    inputs:
      brief:
        description: Brief to generate
        required: true
        default: morning
        type: choice
        options:
          - morning
          - premarket
          - close
  schedule:
    - cron: "30 7 * * 1-5"
      timezone: "Europe/Copenhagen"
    - cron: "0 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: market-brief-${{ github.event.schedule || inputs.brief }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Resolve brief
        id: brief
        shell: bash
        env:
          MANUAL_BRIEF: ${{ inputs.brief }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ -n "$MANUAL_BRIEF" ]]; then
            brief="$MANUAL_BRIEF"
          elif [[ "$EVENT_SCHEDULE" == "30 7 * * 1-5" ]]; then
            brief="morning"
          elif [[ "$EVENT_SCHEDULE" == "0 9 * * 1-5" ]]; then
            brief="premarket"
          else
            brief="close"
          fi
          echo "brief=$brief" >> "$GITHUB_OUTPUT"

      - name: Generate and post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/market_brief.py --brief "${{ steps.brief.outputs.brief }}"

      - name: Persist dashboard data
        run: |
          git config user.name "markedspuls-bot"
          git config user.email "markedspuls-bot@users.noreply.github.com"
          git add data/latest.json data/archive/
          git diff --cached --quiet || git commit -m "Update market brief data"
          git push

