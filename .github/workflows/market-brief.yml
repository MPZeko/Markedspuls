name: Market briefs

on:
  workflow_dispatch:
    inputs:
      brief:
        description: Brief to generate
        required: true
        default: morning
        type: choice
        options:
          - morning
          - premarket
          - close
  schedule:
    - cron: "30 7 * * 1-5"
      timezone: "Europe/Copenhagen"
    - cron: "0 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 16 * * 1-5"
      timezone: "America/New_York"
  # A workflow change performs one real end-to-end morning test.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/market-brief.yml"

permissions:
  contents: write

concurrency:
  group: market-brief-${{ github.event.schedule || inputs.brief || github.event_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve brief
        id: brief
        shell: bash
        env:
          MANUAL_BRIEF: ${{ inputs.brief }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -n "$MANUAL_BRIEF" ]]; then
            brief="$MANUAL_BRIEF"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            brief="morning"
          elif [[ "$EVENT_SCHEDULE" == "30 7 * * 1-5" ]]; then
            brief="morning"
          elif [[ "$EVENT_SCHEDULE" == "0 9 * * 1-5" ]]; then
            brief="premarket"
          else
            brief="close"
          fi
          echo "brief=$brief" >> "$GITHUB_OUTPUT"

      - name: Generate market snapshot
        run: python src/market_brief.py --brief "${{ steps.brief.outputs.brief }}" --dry-run

      - name: Persist market snapshot
        shell: bash
        run: |
          git config user.name "markedspuls-bot"
          git config user.email "markedspuls-bot@users.noreply.github.com"
          git add data/latest.json data/archive/
          git diff --cached --quiet || git commit -m "Update market brief data"
          git pull --rebase origin main
          git push

      - name: Send Discord brief with receipt
        id: discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/post_discord.py

      - name: Persist delivery receipt
        if: always()
        shell: bash
        run: |
          if [[ ! -f data/delivery.json ]]; then
            exit 0
          fi
          git add data/delivery.json
          git diff --cached --quiet || git commit -m "Record Discord delivery"
          git pull --rebase origin main
          git push

      - name: Verify Discord delivery
        if: always()
        shell: bash
        env:
          DISCORD_OUTCOME: ${{ steps.discord.outcome }}
        run: |
          if [[ "$DISCORD_OUTCOME" != "success" ]]; then
            echo "::error::Discord delivery failed. See data/delivery.json for the sanitized receipt."
            exit 1
          fi
